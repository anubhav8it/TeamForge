# Builds TeamForge for the browser (Qt for WebAssembly) on GitHub's machines, so nobody needs Qt
# or Emscripten installed locally. The result (TeamForge.js, TeamForge.wasm, qtloader.js) is
# committed into Phase-2/web/static/app/, which makes Render deploy the new version automatically.
# The project lives in the repository's Phase-2/ folder.
#
# Versions: the official Qt 6.12 documentation (https://doc.qt.io/qt-6/wasm.html) lists
# Emscripten 5.0.5 for Qt 6.12.0. They must match exactly.
name: Build web app

on:
  push:
    branches: [main]
    paths:
      - "Phase-2/**"
      - ".github/workflows/build-web.yml"
      - "!Phase-2/web/static/app/TeamForge.js"
      - "!Phase-2/web/static/app/TeamForge.wasm"
      - "!Phase-2/web/static/app/qtloader.js"
  workflow_dispatch: {}   # "Run workflow" button on the Actions tab

permissions:
  contents: write         # to commit the built files

concurrency:
  group: build-web
  cancel-in-progress: true

jobs:
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: Phase-2
    steps:
      - uses: actions/checkout@v5

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # The WebAssembly build needs the desktop Qt of the same version for its host tools
      # (moc, rcc, qmlcachegen). Install it first; the next step then installs the WebAssembly kit.
      - name: Install Qt 6.12.0 desktop (host tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.12.0"
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Install Qt 6.12.0 for WebAssembly (single-threaded)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.12.0"
          host: all_os
          target: wasm
          arch: wasm_singlethread
          cache: true

      - name: Install Emscripten 5.0.5
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "5.0.5"

      - name: Show versions
        run: |
          echo "QT_ROOT_DIR=$QT_ROOT_DIR"
          echo "QT_HOST_PATH=${QT_HOST_PATH:-<not set>}"
          emcc --version | head -n 1
          cmake --version | head -n 1

      - name: Configure
        run: |
          # The WebAssembly kit's scripts may arrive without the executable bit; call CMake with
          # Qt's toolchain file directly, and point it at the desktop Qt for the host tools.
          chmod +x "$QT_ROOT_DIR"/bin/* 2>/dev/null || true
          HOST="${QT_HOST_PATH:-}"
          if [ -z "$HOST" ] || [ ! -d "$HOST" ]; then
            for d in "$QT_ROOT_DIR/../gcc_64" "$QT_ROOT_DIR/../linux_gcc_64"; do
              if [ -d "$d" ]; then HOST="$(cd "$d" && pwd)"; fi
            done
          fi
          echo "WebAssembly Qt: $QT_ROOT_DIR"
          echo "Host Qt:        ${HOST:-<not found>}"
          ls "$QT_ROOT_DIR/.."
          cmake -S . -B build-wasm -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="$HOST"

      - name: Build
        run: cmake --build build-wasm

      - name: Copy into web/static/app
        run: |
          sh web/tools/copy-wasm.sh build-wasm
          ls -la web/static/app

      - name: Keep a copy of the build (downloadable from this run's page)
        uses: actions/upload-artifact@v4
        with:
          name: teamforge-wasm
          path: |
            Phase-2/web/static/app/TeamForge.js
            Phase-2/web/static/app/TeamForge.wasm
            Phase-2/web/static/app/qtloader.js

      # Someone may push to the branch while this build runs (a README edit, say); a plain push
      # is then refused. So the built files are put on top of the branch's newest commit and
      # pushed, retrying a few times if the branch moves again.
      - name: Commit the build so Render deploys it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          files="web/static/app/TeamForge.js web/static/app/TeamForge.wasm web/static/app/qtloader.js"
          keep="$RUNNER_TEMP/teamforge-build"
          mkdir -p "$keep"
          cp $files "$keep/"
          for attempt in 1 2 3 4 5; do
            git fetch --depth=1 origin "$GITHUB_REF_NAME"
            git checkout -q -f -B "$GITHUB_REF_NAME" FETCH_HEAD
            for f in $files; do cp "$keep/$(basename "$f")" "$f"; done
            git add -f $files
            if git diff --cached --quiet; then
              echo "Build output unchanged; nothing to commit."
              exit 0
            fi
            git commit -q -m "Build TeamForge for WebAssembly [skip ci]"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "The branch moved while building (attempt $attempt); trying again."
            sleep $((attempt * 5))
          done
          echo "Could not push the build after 5 attempts." >&2
          exit 1
