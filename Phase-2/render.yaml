# Render Blueprint for the TeamForge web version (see web/README-WEB.md).
# Both plans are set to "free" on purpose: if `plan` is left out, Render picks a paid plan.
services:
  - type: web
    name: teamforge-web
    runtime: python
    plan: free
    buildCommand: pip install -r web/requirements.txt && python web/tools/precompress.py
    startCommand: python web/server.py
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_EMAILS          # comma-separated; these accounts become admins
        sync: false                # Render asks for the value when you create the Blueprint
      - key: DATABASE_URL
        fromDatabase:
          name: teamforge-db
          property: connectionString

databases:
  - name: teamforge-db
    plan: free                     # free Render Postgres expires 30 days after creation
    databaseName: teamforge
